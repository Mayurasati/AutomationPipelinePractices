# https://sqatools.in/github-actions-fundamentals-for-beginners/

name: workflow dispatch - Manual Release
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production


      Message:     
        description: 'Deployment message'
        required: true
        default: 'Good morning, team!'
        type: string    

jobs:
  deploy1:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying to ${{ inputs.environment }}"
      - run: echo "${{ inputs.Message }}"


  deploy2:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying to ${{ inputs.environment }}"
      - run: echo "${{ inputs.Message }}"


  deploy3:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying to ${{ inputs.environment }}"
      - run: echo "${{ inputs.Message }}"


  deploy4:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying to ${{ inputs.environment }}"
      - run: echo "${{ inputs.Message }}"

 
  TriggerJob:
    uses: ./.github/workflows/onworkflowcall-example.yml
    with:
      environment: ${{ inputs.environment }}
      Message: ${{ inputs.Message }}
    